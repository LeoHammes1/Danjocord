# Danjocord - chat + voz/vídeo (SFU mediasoup)
# Namespace: production
# URL: https://danjocord.leohammes.dev
#
# Segue o padrão do repo KubeCluster (1 arquivo, recursos em ordem:
# Secret → PVC → Deployment → Service → Ingress). Ver doc de arquitetura §9.
#
# Pré-requisitos manuais (uma vez):
#   1. Abrir 40000/UDP (+TCP) no firewall de borda da Hostinger
#      (mesmo runbook do 31700/UDP do gateway LoRa).
#   2. Publicar a imagem em ghcr (pública, multi-arch) — padrão pcb2stl.
#   3. Criar o Secret danjocord-credentials via apply-secrets.sh
#      (DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, JWT_SECRET — a partir do M1).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: danjocord-data
  namespace: production
spec:
  # local-path: o volume nasce no nó do pod (hostinger) e fica lá — mesmo
  # padrão do Postgres/SanJose. SQLite mora aqui.
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: danjocord
  namespace: production
spec:
  replicas: 1                    # estado em memória: 1 réplica, sempre
  strategy:
    type: Recreate               # hostPort + PVC local não convivem com rolling
  selector:
    matchLabels: { app: danjocord }
  template:
    metadata:
      labels: { app: danjocord }
    spec:
      nodeSelector:
        # Brasil: RTT de voz (10–40 ms) + IP público direto + PVC local.
        # Os workers Oracle ficam nos EUA (~150–200 ms) — vetados para mídia.
        kubernetes.io/hostname: hostinger
      containers:
        - name: danjocord
          image: ghcr.io/CHANGE_ME/danjocord:latest   # TODO: publicar imagem (M0)
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: "/data/danjocord.db"
            - name: ANNOUNCED_IP            # usado pelo mediasoup a partir do M3
              value: "72.61.44.156"
            - name: RTC_PORT
              value: "40000"
          ports:
            - containerPort: 8080           # HTTP + WS → via Traefik
            - containerPort: 40000          # mídia SRTP (M3) — direto no nó
              hostPort: 40000
              protocol: UDP
            - containerPort: 40000          # ICE-TCP fallback (M3)
              hostPort: 40000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: 256Mi, cpu: 250m }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: danjocord-data
---
apiVersion: v1
kind: Service
metadata:
  name: danjocord
  namespace: production
spec:
  selector: { app: danjocord }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: danjocord
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts: [danjocord.leohammes.dev]
      secretName: danjocord-tls
  rules:
    - host: danjocord.leohammes.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: danjocord
                port: { number: 8080 }
