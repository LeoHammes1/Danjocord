# Danjocord - chat + voz/vídeo (SFU mediasoup)
# Namespace: production
# URL: https://danjocord.leohammes.dev
#
# Segue o padrão do repo KubeCluster (1 arquivo, recursos em ordem:
# Secret → PVC → Deployment → Service → Ingress). Ver doc de arquitetura §9.
#
# Pré-requisitos manuais (uma vez):
#   1. Abrir 40000/UDP (+TCP) no firewall de borda da Hostinger
#      (mesmo runbook do 31700/UDP do gateway LoRa).
#   2. Publicar a imagem em ghcr (pública, multi-arch) — padrão pcb2stl.
#   3. Criar o app no Discord Developer Portal (OAuth2 → Redirects):
#        https://danjocord.leohammes.dev/auth/discord/callback   (produção)
#        http://localhost:8080/auth/discord/callback             (dev)
#   4. Criar o Secret danjocord-credentials via apply-secrets.sh do KubeCluster
#      (DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, JWT_SECRET).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: danjocord-data
  namespace: production
spec:
  # local-path: o volume nasce no nó do pod (hostinger) e fica lá — mesmo
  # padrão do Postgres/SanJose. SQLite mora aqui.
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: danjocord
  namespace: production
spec:
  replicas: 1                    # estado em memória: 1 réplica, sempre
  strategy:
    type: Recreate               # hostPort + PVC local não convivem com rolling
  selector:
    matchLabels: { app: danjocord }
  template:
    metadata:
      labels: { app: danjocord }
    spec:
      nodeSelector:
        # Brasil: RTT de voz (10–40 ms) + IP público direto + PVC local.
        # Os workers Oracle ficam nos EUA (~150–200 ms) — vetados para mídia.
        kubernetes.io/hostname: hostinger
      securityContext:
        # local-path monta o PVC root:root; sem isto o processo (USER node,
        # uid 1000) não cria o SQLite em /data e o pod entra em CrashLoop —
        # mesmo fix do zookeeper.yaml/artemis.yaml do KubeCluster
        fsGroup: 1000
      containers:
        - name: danjocord
          image: ghcr.io/leohammes1/danjocord:latest  # publicada pelo release.yml; deixar o package PÚBLICO no GitHub
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: "/data/danjocord.db"
            - name: ANNOUNCED_IP            # usado pelo mediasoup a partir do M3
              value: "72.61.44.156"
            - name: RTC_PORT
              value: "40000"
            # --- identidade (M1, doc §5) ---
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: danjocord-credentials, key: DISCORD_CLIENT_ID }
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: danjocord-credentials, key: DISCORD_CLIENT_SECRET }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: danjocord-credentials, key: JWT_SECRET }
            - name: PUBLIC_BASE_URL           # o redirect_uri do OAuth aponta para cá
              value: "https://danjocord.leohammes.dev"
            - name: APP_URL                   # navegador volta para cá com o one-time code
              value: "https://danjocord.leohammes.dev"
            # --- convites e moderação (M10, doc §5) ---
            - name: GUILD_NAME                # a landing PÚBLICA do convite mostra isto (e mais nada de dentro)
              value: "Danjocord"
            # Bootstrap do primeiro dono (roadmap 116). Num deploy limpo a
            # allowlist nasce VAZIA: o OAuth recusa todo mundo e não existe
            # admin para criar convite — o pod sobe saudável, responde /healthz
            # e ninguém entra. Com esta env, o boot põe ESTE discord_id na
            # allowlist (SÓ quando a allowlist está vazia) e o primeiro login
            # dele vira `owner`. Reiniciar o pod depois disso não mexe em nada,
            # e trocar o valor não promove ninguém numa guild que já existe.
            #
            # DESCARTADO de propósito: "o primeiro que logar vira dono" — o
            # Ingress é público e quem passasse na frente levaria o servidor.
            #
            # Preencha com o SEU id do Discord (Configurações → Avançado →
            # Modo desenvolvedor → clique com o botão direito no seu nome →
            # Copiar ID) e aplique ANTES do primeiro login. Sem ele e com a
            # allowlist vazia, o servidor loga um aviso explicando isto no boot.
            # - name: DANJOCORD_OWNER_DISCORD_ID
            #   value: "000000000000000000"
          ports:
            - containerPort: 8080           # HTTP + WS → via Traefik
            - containerPort: 40000          # mídia SRTP (M3) — direto no nó
              hostPort: 40000
              protocol: UDP
            - containerPort: 40000          # ICE-TCP fallback (M3)
              hostPort: 40000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: 256Mi, cpu: 250m }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: danjocord-data
---
apiVersion: v1
kind: Service
metadata:
  name: danjocord
  namespace: production
spec:
  selector: { app: danjocord }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: danjocord
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts: [danjocord.leohammes.dev]
      secretName: danjocord-tls
  rules:
    - host: danjocord.leohammes.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: danjocord
                port: { number: 8080 }
