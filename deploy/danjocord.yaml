# Danjocord - chat + voz/vídeo (SFU mediasoup)
# Namespace: production
# URL: https://danjocord.leohammes.dev
#
# Segue o padrão do repo KubeCluster (1 arquivo, recursos em ordem:
# Secret → PVC → Deployment → Service → Ingress). Ver doc de arquitetura §9.
#
# Pré-requisitos manuais (uma vez):
#   1. Abrir 40000/UDP (+TCP) no firewall de borda da Hostinger
#      (mesmo runbook do 31700/UDP do gateway LoRa).
#   2. Publicar a imagem em ghcr (pública, multi-arch) — padrão pcb2stl.
#   3. Criar o app no Discord Developer Portal (OAuth2 → Redirects):
#        https://danjocord.leohammes.dev/auth/discord/callback   (produção)
#        http://localhost:8080/auth/discord/callback             (dev)
#   4. Criar o Secret danjocord-credentials via apply-secrets.sh do KubeCluster
#      (DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, JWT_SECRET).
#   5. (M14, para a página de download e o auto-update) Sortear um segredo
#      (`openssl rand -hex 32`) e pô-lo em DOIS lugares: DANJOCORD_PUBLISH_TOKEN
#      no Secret acima, e o mesmo valor como secret DANJOCORD_PUBLISH_TOKEN nas
#      Actions do repo. É com ele que o CI entrega o instalador ao servidor.
#      Sem ele o app funciona inteiro; só a publicação de release responde 503.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: danjocord-data
  namespace: production
spec:
  # local-path: o volume nasce no nó do pod (hostinger) e fica lá — mesmo
  # padrão do Postgres/SanJose. SQLite mora aqui.
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: danjocord
  namespace: production
spec:
  replicas: 1                    # estado em memória: 1 réplica, sempre
  strategy:
    type: Recreate               # hostPort + PVC local não convivem com rolling
  selector:
    matchLabels: { app: danjocord }
  template:
    metadata:
      labels: { app: danjocord }
    spec:
      nodeSelector:
        # Brasil: RTT de voz (10–40 ms) + IP público direto + PVC local.
        # Os workers Oracle ficam nos EUA (~150–200 ms) — vetados para mídia.
        kubernetes.io/hostname: hostinger
      # O Danjocord NÃO fala com a API do Kubernetes — nem uma linha. O token
      # montado por padrão é, portanto, só superfície: qualquer execução de
      # código no pod ganharia uma credencial de cluster de graça. A da
      # serviceAccount `default` daqui é fraca (medida: só self-review e
      # discovery), então isto é higiene, não emergência — mas é uma linha.
      automountServiceAccountToken: false
      securityContext:
        # local-path monta o PVC root:root; sem isto o processo (USER node,
        # uid 1000) não cria o SQLite em /data e o pod entra em CrashLoop —
        # mesmo fix do zookeeper.yaml/artemis.yaml do KubeCluster
        fsGroup: 1000
        # O Dockerfile já tem `USER node`, mas isso é promessa da IMAGEM. Estas
        # três linhas são a garantia do CLUSTER: valem mesmo se alguém trocar a
        # imagem, e o kubelet RECUSA subir o pod se ela vier rodando como root.
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: danjocord
          image: ghcr.io/leohammes1/danjocord:latest  # publicada pelo release.yml; deixar o package PÚBLICO no GitHub
          imagePullPolicy: Always
          securityContext:
            # nada aqui precisa de privilégio: a porta de mídia é a 40000 (acima
            # de 1024, então nem NET_BIND_SERVICE), o mediasoup roda como
            # processo comum e o SQLite mora no PVC.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # MEDIDO, e não deduzido. No pod em execução, `find / -xdev -newer
            # /proc/1` fora de /data não devolve um arquivo, /tmp está vazio
            # desde o build da imagem, e os únicos descritores de ESCRITA do
            # processo são os três do SQLite (danjocord.db, -wal, -shm) — o
            # worker do mediasoup não tem nenhum. O caminho completo também
            # rodou com `docker run --read-only` (boot, migrations, seed do
            # soundboard, mensagem, anexo de 8 MB, upload de som, busca FTS5,
            # preview de link e o smoke de voz) sem escrever fora dos volumes.
            #
            # O /tmp abaixo NÃO é para o caminho normal — é para o SQLite.
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: "/data/danjocord.db"
            # O único disco que o processo pode querer FORA do PVC. O SQLite
            # escreve arquivos temporários quando uma operação não cabe na
            # cache: ordenação grande, CREATE INDEX de uma migration futura,
            # VACUUM manual. O `PRAGMA temp_store` do better-sqlite3 é o default
            # de COMPILAÇÃO, que é ARQUIVO (o `defines.gypi` dele não define
            # SQLITE_TEMP_STORE), e o db/index.ts não emite o pragma.
            #
            # ORDEM DE IMPORTÂNCIA, medida com dois pods idênticos rodando a
            # mesma query, um com o emptyDir de /tmp e outro sem:
            #
            #     sem o mount -> SQLITE_IOERR_GETTEMPPATH: disk I/O error
            #     com o mount -> escreveu 24 MB de temporário, tudo bem
            #
            # Ou seja: quem segura é o VOLUME abaixo, não esta env. O SQLite
            # tenta SQLITE_TMPDIR, TMPDIR, /var/tmp, /usr/tmp, /tmp e o CWD, e
            # TESTA a gravabilidade de cada um antes de usar — com a raiz
            # somente-leitura ele descarta os outros e acha /tmp sozinho. A env
            # existe para tirar o resultado da ORDEM DE TENTATIVA (e do CWD de
            # quem der `kubectl exec`), não para o caminho funcionar.
            #
            # E o motivo de isto não aparecer em teste casual: o temporário só
            # vira ARQUIVO quando passa da cache de 16 MB do better-sqlite3.
            # Abaixo disso ele nunca toca o disco — que é por que a medição do
            # pod em operação normal mostra /tmp vazio. É o EROFS que não
            # aparece no boot: aparece no dia em que uma query derrama.
            - name: SQLITE_TMPDIR
              value: "/tmp"
            - name: ANNOUNCED_IP            # usado pelo mediasoup a partir do M3
              value: "72.61.44.156"
            - name: RTC_PORT
              value: "40000"
            # --- identidade (M1, doc §5) ---
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: danjocord-credentials, key: DISCORD_CLIENT_ID }
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: danjocord-credentials, key: DISCORD_CLIENT_SECRET }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: danjocord-credentials, key: JWT_SECRET }
            - name: PUBLIC_BASE_URL           # o redirect_uri do OAuth aponta para cá
              value: "https://danjocord.leohammes.dev"
            - name: APP_URL                   # navegador volta para cá com o one-time code
              value: "https://danjocord.leohammes.dev"
            # --- convites e moderação (M10, doc §5) ---
            - name: GUILD_NAME                # a landing PÚBLICA do convite mostra isto (e mais nada de dentro)
              value: "Danjocord"
            # Bootstrap do primeiro dono (roadmap 116). Num deploy limpo a
            # allowlist nasce VAZIA: o OAuth recusa todo mundo e não existe
            # admin para criar convite — o pod sobe saudável, responde /healthz
            # e ninguém entra. Com esta env, o boot põe ESTE discord_id na
            # allowlist (SÓ quando a allowlist está vazia) e o primeiro login
            # dele vira `owner`. Reiniciar o pod depois disso não mexe em nada,
            # e trocar o valor não promove ninguém numa guild que já existe.
            #
            # DESCARTADO de propósito: "o primeiro que logar vira dono" — o
            # Ingress é público e quem passasse na frente levaria o servidor.
            #
            # Vale ANTES do primeiro login. Sem ele e com a allowlist vazia, o
            # servidor loga um aviso explicando isto no boot.
            #
            # Não é segredo (é um id público do Discord), então fica no manifest
            # e não no Secret — quem lê o deploy precisa saber de quem é a guild.
            - name: DANJOCORD_OWNER_DISCORD_ID
              value: "215666123834654720"     # Leonardo
            # --- distribuição do app desktop (M14) ---
            # O instalador NÃO fica num Release do GitHub: o CI compila (NSIS
            # precisa de Windows) e faz POST dos artefatos aqui, e eles moram no
            # PVC, ao lado do SQLite — o `releasesDir` do config é derivado do
            # DB_PATH justamente para os dois nunca se separarem de volume.
            #
            # O custo está declarado em updates/store.ts: este pod passa a
            # SERVIR os bytes, e é o mesmo nó que carrega a mídia (hostPort
            # 40000/UDP). São ~100 MB por amigo por release, espalhados por
            # horas (a checagem é no login e a cada 6 h, nunca simultânea).
            # Medido no nó: 74 GB livres no disco do local-path, contra 396 KB
            # de banco — espaço não é a restrição, banda é.
            #
            # Credencial de MÁQUINA do POST /api/updates/publish (o CI a manda
            # como Bearer). `optional: true` de propósito: sem ele, um deploy
            # feito antes de a chave existir no Secret trava o pod em
            # CreateContainerConfigError — o app inteiro fora por causa de uma
            # página. Com ele, o pod sobe normal e só a publicação responde 503
            # dizendo o que falta; o download do que já está publicado continua.
            - name: DANJOCORD_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: danjocord-credentials
                  key: DANJOCORD_PUBLISH_TOKEN
                  optional: true
          ports:
            - containerPort: 8080           # HTTP + WS → via Traefik
            - containerPort: 40000          # mídia SRTP (M3) — direto no nó
              hostPort: 40000
              protocol: UDP
            - containerPort: 40000          # ICE-TCP fallback (M3)
              hostPort: 40000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { memory: 256Mi, cpu: 250m }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: danjocord-data
        - name: tmp
          # emptyDir de DISCO, e não `medium: Memory`: tmpfs conta no limite de
          # memória do container (1Gi, acima) e um derrame de ordenação viraria
          # OOMKill — SIGKILL sem log nenhum — em vez de um arquivo temporário.
          # É pela mesma razão que isto não se resolve com `PRAGMA temp_store =
          # MEMORY` no db/index.ts: trocaria disco por RAM contra o mesmo teto.
          #
          # O `fsGroup: 1000` do pod já o faz nascer gravável para o uid 1000,
          # sem chown. 512Mi cobre um VACUUM manual deste banco; se um dia não
          # cobrir, o caminho sem temporário é `VACUUM INTO '/data/novo.db'`.
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: danjocord
  namespace: production
spec:
  selector: { app: danjocord }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: danjocord
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts: [danjocord.leohammes.dev]
      secretName: danjocord-tls
  rules:
    - host: danjocord.leohammes.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: danjocord
                port: { number: 8080 }
