# Desenvolvimento com Docker:
#
#   docker compose watch      # sobe e sincroniza o código ao salvar
#
# O watch usa "sync" (compose copia os arquivos alterados para dentro do
# container) em vez de bind mount — em host Windows, eventos de arquivo não
# atravessam bind mounts de forma confiável; sync resolve isso e o tsc -w /
# tsx watch / vite dentro do container reagem normalmente.
#
# Server: http://localhost:8080 · Cliente (vite): http://localhost:5173
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
      - "5173:5173"
      - "41000:41000/udp" # mídia SRTP (mediasoup; 41000 = default de dev, ver config.ts)
      - "41000:41000/tcp" # ICE-TCP fallback
    environment:
      DANJOCORD_DEV_AUTH: "1"
      DB_PATH: /app/apps/server/data/danjocord.db
      ANNOUNCED_IP: "127.0.0.1" # browser no host alcança o worker pela porta mapeada
      # OAuth do Discord (M1). Os valores vêm do .env da raiz, que o compose lê
      # sozinho e o git ignora — o secret nunca entra no repo. Ausentes, o
      # /auth/discord/start responde 503 e só o login de dev funciona; é por
      # isso que o `:-` está aqui, para o compose subir sem o .env.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # PUBLIC_BASE_URL e APP_URL ficam nos defaults do config.ts de propósito
      # (http://localhost:8080 e http://localhost:5173): em dev o vite serve o
      # cliente numa origem e o backend responde noutra. Fixá-los aqui só
      # criaria uma segunda fonte da verdade para o redirect_uri.
    volumes:
      - danjocord-data:/app/apps/server/data
    develop:
      watch:
        - action: sync
          path: ./packages/protocol/src
          target: /app/packages/protocol/src
        - action: sync
          path: ./apps/server/src
          target: /app/apps/server/src
        - action: sync
          path: ./apps/server/migrations
          target: /app/apps/server/migrations
        - action: sync
          path: ./apps/client/src
          target: /app/apps/client/src
        - action: sync
          path: ./apps/client/index.html
          target: /app/apps/client/index.html
        # assets de áudio (M8 sons de UI, M9 seeds do soundboard): sem estas
        # duas linhas, regerar um som exigia rebuild da imagem para o container
        # ver o arquivo novo — e o seed do soundboard leria os antigos
        - action: sync
          path: ./apps/client/assets
          target: /app/apps/client/assets
        - action: sync
          path: ./apps/server/assets
          target: /app/apps/server/assets
        # mudou dependência? rebuild da imagem
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  danjocord-data:
