<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP (revisão M6 #5): no desktop este renderer detém a ponte com os
         tokens decifrados — um XSS aqui valeria a sessão inteira. connect-src
         abre http/https/ws/wss porque o servidor é self-hosted (a origem varia
         por instância); script-src fica preso ao próprio bundle. -->
    <meta
      http-equiv="content-security-policy"
      content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob: https:; media-src 'self' app: blob: mediastream:; connect-src 'self' app: http: https: ws: wss:; base-uri 'none'; object-src 'none'; frame-src 'none'"
    />
    <title>Danjocord</title>
    <!-- favicon inline: um arquivo a menos para o app:// do desktop servir
         (img-src já permite data:, a CSP não muda por causa disto) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%235865f2'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Segoe UI,sans-serif' font-size='20' font-weight='700' fill='%23ffffff'%3ED%3C/text%3E%3C/svg%3E"
    />
    <!-- o CSS vem do main.ts (src/styles/index.css): um bundle só, com os
         tokens resolvidos pelo vite -->
  </head>
  <body>
    <!-- as duas views começam ocultas; main.ts decide qual mostrar no boot -->
    <div id="login" hidden>
      <div class="login-card">
        <h1>Danjocord</h1>
        <p class="login-sub">uma guild, os amigos, self-hosted</p>
        <p id="login-error" hidden></p>
        <button id="login-discord" type="button">Entrar com Discord</button>
        <!-- login dev: o main.ts revela só quando import.meta.env.DEV. Em
             produção o bloco nem aparece (antes aparecia e o /auth/dev
             respondia 404 — feio e confuso para quem só quer entrar) -->
        <div class="login-dev" id="login-dev" hidden>
          <h2>dev</h2>
          <form id="dev-form">
            <input id="dev-username" autocomplete="off" placeholder="username" />
            <button type="submit">Entrar</button>
          </form>
        </div>
      </div>
    </div>

    <!-- O app é um grid de 4 colunas (guilds | canais | conteúdo | membros);
         quem monta o grid é styles/layout.css. Os ids abaixo são o contrato
         com o main.ts e com os módulos de ui/ — não renomear. -->
    <div id="app" hidden>
      <nav id="guilds" aria-label="Servidores">
        <!-- uma guild só, por desenho do projeto: o pill é decorativo hoje e
             existe para a coluna não nascer vazia -->
        <button id="guild-home" type="button" aria-current="true" aria-label="Danjocord">D</button>
      </nav>

      <aside id="sidebar">
        <button id="sidebar-head" type="button" aria-expanded="false">Danjocord</button>
        <div id="channels"></div>
        <!-- rodapé de voz: só aparece conectado (main.ts tira o [hidden]) -->
        <div id="voice-footer" hidden>
          <div class="voice-footer-info">
            <span id="voice-footer-status">Voz conectada</span>
            <span id="voice-footer-channel"></span>
          </div>
          <div class="voice-footer-actions">
            <button id="voice-camera" type="button" title="Ligar câmera">📷</button>
            <button id="voice-stream" type="button" title="Transmitir tela">🖥️</button>
            <button id="voice-mute" type="button" title="Mutar">🎙️</button>
            <button id="voice-deafen" type="button" title="Ensurdecer">🎧</button>
            <button id="voice-leave" type="button" title="Desconectar">Sair</button>
          </div>
          <!-- push-to-talk (M6): só no desktop — main.ts revela quando a ponte existe -->
          <div id="ptt-section" hidden>
            <label class="ptt-toggle">
              <input id="ptt-toggle" type="checkbox" />
              <span id="ptt-label">Push-to-talk</span>
            </label>
            <button id="ptt-key" type="button" title="Definir a tecla de push-to-talk">definir tecla</button>
          </div>
        </div>
        <!-- painel do usuário: quem eu sou + os controles que valem em
             qualquer canal. Os botões de ícone nascem vazios de propósito —
             o SVG é criado em JS (ui/icons.ts), nunca por innerHTML -->
        <div id="user-panel">
          <img id="me-avatar" class="avatar" alt="" hidden />
          <div class="user-panel-id">
            <span id="me-name"></span>
            <span id="me-sub"></span>
          </div>
          <button id="user-mute" class="icon-btn" type="button" aria-label="Mutar microfone"></button>
          <button id="user-deafen" class="icon-btn" type="button" aria-label="Ensurdecer"></button>
          <button id="user-settings" class="icon-btn" type="button" aria-label="Configurações"></button>
          <button id="logout" class="icon-btn" type="button" aria-label="Sair da conta"></button>
        </div>
      </aside>

      <header id="channel-head">
        <span id="channel-icon"></span>
        <h1 id="channel-name">Danjocord</h1>
        <span id="channel-topic"></span>
        <div id="head-actions">
          <button id="toggle-members" class="icon-btn" type="button" aria-label="Mostrar ou ocultar membros" aria-expanded="true"></button>
        </div>
        <span id="status">conectando…</span>
      </header>

      <!-- painel de stream (M5): a transmissão ASSISTIDA (uma por vez), acima da grade -->
      <div id="stream-panel" hidden>
        <div class="stream-panel-head">
          <h2>Transmissão de <span id="stream-title"></span></h2>
          <div class="stream-panel-actions">
            <!-- só aparece quando o autoplay sem mute foi barrado pelo navegador -->
            <button id="stream-unmute" type="button" hidden>Ativar som</button>
            <button id="stream-stop" type="button">Parar de assistir</button>
          </div>
        </div>
        <div id="stream-box"></div>
      </div>

      <!-- grade de vídeo (M4): só aparece em voz com ≥1 tile (preview local conta) -->
      <div id="video-panel" hidden>
        <div class="video-panel-head">
          <h2>Vídeo</h2>
          <button id="video-collapse" type="button" title="Recolher vídeos">▾</button>
        </div>
        <div id="video-grid"></div>
      </div>

      <main id="messages"></main>
      <!-- aria-live: leitor de tela anuncia "fulano está digitando…" sem roubar o foco -->
      <div id="typing" aria-live="polite"></div>
      <form id="composer">
        <textarea id="input" rows="1" autocomplete="off" placeholder="Mensagem em #geral"></textarea>
        <button type="submit">Enviar</button>
      </form>

      <aside id="members-panel" aria-label="Membros">
        <div id="members"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
