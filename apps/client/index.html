<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danjocord</title>
    <style>
      :root {
        --bg: #14181e;
        --surface: #1b212a;
        --surface-2: #222a35;
        --ink: #e5e9ef;
        --muted: #98a3b1;
        --line: #2b3441;
        --accent: #ff7a63;
        --ok: #63b98a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
        height: 100vh;
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 48px 1fr auto;
        grid-template-areas: "side head" "side msgs" "side form";
      }
      header {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0 1rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 1rem; margin: 0; }
      #status {
        font-size: 0.75rem;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
      }
      #status.online { color: var(--ok); }
      #status.offline { color: var(--accent); }
      aside {
        grid-area: side;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow-y: auto;
      }
      aside h2 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin: 0 0 0.4rem;
      }
      #channels button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--muted);
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.92rem;
      }
      #channels button.active { background: var(--surface-2); color: var(--ink); }
      #members li { list-style: none; font-size: 0.9rem; color: var(--muted); padding: 0.15rem 0; }
      #members li.online { color: var(--ink); }
      #members li.online::before { content: "● "; color: var(--ok); font-size: 0.7em; vertical-align: 0.15em; }
      #members { padding: 0; margin: 0; }
      main { grid-area: msgs; overflow-y: auto; padding: 1rem; }
      .msg { margin-bottom: 0.6rem; }
      .msg .author { font-weight: 600; margin-right: 0.5rem; }
      .msg .time { color: var(--muted); font-size: 0.75rem; margin-left: 0.5rem; }
      .msg.pending { opacity: 0.45; }
      form {
        grid-area: form;
        display: flex;
        gap: 0.6rem;
        padding: 0.8rem 1rem;
        border-top: 1px solid var(--line);
      }
      input {
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        padding: 0.55rem 0.8rem;
        font-size: 0.95rem;
      }
      input:focus-visible { outline: 2px solid var(--accent); }
      button[type="submit"] {
        background: var(--accent);
        color: #14181e;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 0 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <aside>
      <div>
        <h2>Canais</h2>
        <div id="channels"></div>
      </div>
      <div>
        <h2>Membros</h2>
        <ul id="members"></ul>
      </div>
    </aside>
    <header>
      <h1>Danjocord</h1>
      <span id="status">conectando…</span>
    </header>
    <main id="messages"></main>
    <form id="composer">
      <input id="input" autocomplete="off" placeholder="Mensagem em #geral" />
      <button type="submit">Enviar</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
