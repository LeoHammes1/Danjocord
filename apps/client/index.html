<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danjocord</title>
    <style>
      :root {
        --bg: #14181e;
        --surface: #1b212a;
        --surface-2: #222a35;
        --ink: #e5e9ef;
        --muted: #98a3b1;
        --line: #2b3441;
        --accent: #ff7a63;
        --ok: #63b98a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
        height: 100vh;
      }
      /* #login e #app têm display próprio, que venceria o [hidden] do UA */
      [hidden] { display: none !important; }

      /* --- tela de login --- */
      #login {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: min(340px, 92vw);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 2rem 1.6rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
      .login-card h1 { margin: 0; font-size: 1.35rem; }
      .login-sub { margin: -0.6rem 0 0; color: var(--muted); font-size: 0.85rem; }
      #login-error { margin: 0; color: var(--accent); font-size: 0.85rem; }
      #login-discord {
        background: #5865f2; /* blurple — o botão é literalmente o Discord */
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      #login-discord:hover { filter: brightness(1.08); }
      .login-dev {
        border-top: 1px solid var(--line);
        padding-top: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .login-dev h2 {
        margin: 0;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        text-align: left;
      }
      .login-dev form { display: flex; gap: 0.5rem; }
      .login-dev button[type="submit"] { background: var(--surface-2); color: var(--muted); font-weight: 500; }
      .login-dev button[type="submit"]:hover { color: var(--ink); }

      /* --- app --- */
      #app {
        height: 100vh;
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 48px 1fr auto auto;
        grid-template-areas: "side head" "side msgs" "side typing" "side form";
      }
      header {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0 1rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 1rem; margin: 0; }
      #status {
        font-size: 0.75rem;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--muted);
      }
      #status.online { color: var(--ok); }
      #status.offline { color: var(--accent); }
      #me { margin-left: auto; display: flex; align-items: center; gap: 0.55rem; }
      #me-avatar { width: 24px; height: 24px; border-radius: 50%; }
      #me-name { font-size: 0.88rem; }
      #logout {
        background: none;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.25rem 0.7rem;
        font-size: 0.78rem;
        cursor: pointer;
      }
      #logout:hover { color: var(--ink); border-color: var(--muted); }
      aside {
        grid-area: side;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow-y: auto;
      }
      aside h2 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin: 0 0 0.4rem;
      }
      #channels button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--muted);
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.92rem;
      }
      #channels button.active { background: var(--surface-2); color: var(--ink); }
      #members li { list-style: none; font-size: 0.9rem; color: var(--muted); padding: 0.15rem 0; }
      #members li.online { color: var(--ink); }
      #members li.online::before { content: "● "; color: var(--ok); font-size: 0.7em; vertical-align: 0.15em; }
      #members { padding: 0; margin: 0; }
      /* overflow-anchor: a paginação preserva o ponto de leitura somando o
         delta de altura no scrollTop; o anchoring nativo faria o ajuste em
         dobro em alguns navegadores */
      main { grid-area: msgs; overflow-y: auto; padding: 1rem; overflow-anchor: none; }
      /* padding-right reserva o canto das ações — hover não sobrepõe texto */
      .msg { margin-bottom: 0.6rem; position: relative; padding-right: 3.4rem; }
      .msg .author { font-weight: 600; margin-right: 0.5rem; }
      .msg .time { color: var(--muted); font-size: 0.75rem; margin-left: 0.5rem; }
      .msg .muted { color: var(--muted); font-size: 0.75rem; }
      .msg.pending { opacity: 0.45; }
      .load-retry {
        display: block;
        margin: 1.2rem auto;
        background: var(--surface-2);
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      .load-retry:hover { color: var(--ink); }
      /* ações (editar/apagar) só no hover — discretas, sem poluir a leitura */
      .msg .actions { position: absolute; right: 0; top: 0; display: none; gap: 0.2rem; }
      .msg:hover .actions { display: inline-flex; }
      .msg .actions button {
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 4px;
        font-size: 0.7rem;
        line-height: 1;
        padding: 0.15rem 0.35rem;
        cursor: pointer;
      }
      .msg .actions button:hover { color: var(--ink); border-color: var(--muted); }
      .msg .edit-input {
        width: min(480px, 70%);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        padding: 0.15rem 0.5rem;
        font-size: 0.9rem;
      }
      /* min-height reserva a linha: o indicador aparece/some sem empurrar as
         mensagens (um pulo de layout bem na hora de ler seria pior que o vão) */
      #typing {
        grid-area: typing;
        min-height: 1.3rem;
        padding: 0.15rem 1rem 0;
        font-size: 0.75rem;
        color: var(--muted);
      }
      #composer {
        grid-area: form;
        display: flex;
        gap: 0.6rem;
        padding: 0.8rem 1rem;
        border-top: 1px solid var(--line);
      }
      input {
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        padding: 0.55rem 0.8rem;
        font-size: 0.95rem;
      }
      input:focus-visible { outline: 2px solid var(--accent); }
      button[type="submit"] {
        background: var(--accent);
        color: #14181e;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 0 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- as duas views começam ocultas; main.ts decide qual mostrar no boot -->
    <div id="login" hidden>
      <div class="login-card">
        <h1>Danjocord</h1>
        <p class="login-sub">uma guild, os amigos, self-hosted</p>
        <p id="login-error" hidden></p>
        <button id="login-discord">Entrar com Discord</button>
        <!-- visível sempre: em produção o /auth/dev responde 404 e o erro aparece aqui mesmo -->
        <div class="login-dev">
          <h2>dev</h2>
          <form id="dev-form">
            <input id="dev-username" autocomplete="off" placeholder="username" />
            <button type="submit">Entrar</button>
          </form>
        </div>
      </div>
    </div>

    <div id="app" hidden>
      <aside>
        <div>
          <h2>Canais</h2>
          <div id="channels"></div>
        </div>
        <div>
          <h2>Membros</h2>
          <ul id="members"></ul>
        </div>
      </aside>
      <header>
        <h1>Danjocord</h1>
        <span id="status">conectando…</span>
        <div id="me">
          <img id="me-avatar" alt="" hidden />
          <span id="me-name"></span>
          <button id="logout">Sair</button>
        </div>
      </header>
      <main id="messages"></main>
      <!-- aria-live: leitor de tela anuncia "fulano está digitando…" sem roubar o foco -->
      <div id="typing" aria-live="polite"></div>
      <form id="composer">
        <input id="input" autocomplete="off" placeholder="Mensagem em #geral" />
        <button type="submit">Enviar</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
