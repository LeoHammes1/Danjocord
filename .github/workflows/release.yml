# Publica a imagem de produção no ghcr a cada push na main (padrão pcb2stl do
# KubeCluster: imagem PÚBLICA, o kubelet puxa sem imagePullSecret; depois de
# publicar, rolar o deployment no cluster:
#   ./access/kubectl.sh rollout restart deployment/danjocord -n production
#
# Só linux/amd64: o pod pina no nó hostinger (x86_64). Se um dia despinar,
# adicionar linux/arm64 em `platforms`.
name: release
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # metadata-action normaliza para minúsculas (exigência do ghcr)
          images: ghcr.io/${{ github.repository_owner }}/danjocord
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
