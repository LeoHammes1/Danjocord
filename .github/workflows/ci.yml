name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sem `version:` de propósito — a versão vem do campo packageManager do
      # package.json raiz. Declarar nos dois lugares é erro fatal desde o
      # action-setup v4 ("Multiple versions of pnpm specified"), e o
      # desktop-release.yml já seguia esta regra.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # os testes existem desde o M1 e nunca rodaram sozinhos (roadmap 122):
      # 105 no servidor + 23 no cliente, e os do M9 cobrem justamente a
      # validação de upload — o lugar onde um erro é furo de segurança
      - run: pnpm test
