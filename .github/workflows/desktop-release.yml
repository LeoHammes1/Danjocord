# Release do app desktop (M6, refeito no M14): tag v* → instalador Windows no
# Release da tag → os apps instalados dos amigos se atualizam sozinhos.
#
# O fluxo, ponta a ponta:
#   1. git tag v0.1.0 && git push origin v0.1.0
#   2. este workflow (windows-latest — NSIS e os módulos nativos precisam do
#      SO alvo) roda `pnpm --filter @danjocord/desktop dist`: bundla o
#      renderer (build do apps/client com VITE_API_BASE de produção via
#      scripts/bundle-renderer.mjs), compila o main e chama o electron-builder,
#      que gera o instalador e PUBLICA os artefatos (Setup.exe + latest.yml)
#      no Release da tag.
#   3. os apps instalados atualizam. Mas NÃO lendo o GitHub direto — este repo é
#      privado, e um `electron-updater` apontado para cá levaria 404 (a API do
#      GitHub responde 404, e não 401, a repo privado sem credencial). A saída
#      óbvia seria embutir um token no instalador, o que é entregá-lo a quem
#      tiver o `.exe`.
#
#      Em vez disso o FEED é o próprio servidor: `https://danjocord.leohammes.dev
#      /api/updates/feed/`. Ele valida a sessão de quem pede e devolve um 302
#      para a URL pré-assinada que a API do GitHub emite — o token de leitura
#      fica no Secret do cluster e nenhum byte de instalador atravessa o nó que
#      carrega a voz. Ver apps/server/src/updates/github.ts.
#
# `releaseType: release` no package.json (e não o `draft` que é o default do
# electron-builder): o release nasce PUBLICADO. O checkpoint humano deste
# processo é o `git tag` — um rascunho a mais só cria o modo de falha em que
# tudo "deu certo" e a atualização silenciosamente não acontece porque alguém
# esqueceu de clicar em Publish. O repo é privado, então publicar aqui não
# torna nada público.
#
# GH_TOKEN: o GITHUB_TOKEN do próprio job basta (permissions.contents: write).
name: desktop-release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # a versão do pnpm vem do campo packageManager do package.json raiz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # o build do cliente (dentro do dist, via bundle-renderer) importa o
      # dist do protocol — compilar antes
      - run: pnpm --filter @danjocord/protocol build
      # TRAVA DE DISTRIBUIÇÃO (M12, reescrita no M14).
      #
      # 12 dos 14 sons de UI são assets proprietários do Discord
      # (ATTRIBUTIONS.md), e a condição que o Leonardo escreveu para usá-los é
      # literal: "repo privado, sem instalador para fora, instância fechada".
      # Este workflow é o momento exato em que o app sai daqui, e a advertência
      # não pode depender de alguém lembrar dela na hora de rodar `git tag`.
      #
      # A trava ANTERIOR checava se `catalog.ts` aponta para `.mp3`. Ela era um
      # PROXY da condição, e o proxy passou a estar errado: o instalador não vai
      # mais "para fora" nenhum — o Release é privado e o download passa por
      # `/api/updates`, que exige sessão no servidor. A trava certa é a condição
      # em si, e ela é verificável: **o repositório tem de ser privado**.
      #
      # É uma trava MAIS FORTE que a antiga, não mais fraca: se um dia alguém
      # tornar este repo público, o build de release para de funcionar — mesmo
      # que os sons continuem exatamente como estão. E ela cobre o que a antiga
      # não cobria (o código-fonte dos sons no repo, não só o binário).
      #
      # Para distribuir de verdade, para fora: `pnpm --filter @danjocord/client
      # sounds --all` repõe os 14 sintetizados; troque as extensões no
      # catalog.ts/assets.ts, re-meça, e só então torne o repo público.
      - name: o repositorio precisa continuar privado
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRIVADO=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "repos/$GITHUB_REPOSITORY private=$PRIVADO"
          if [ "$PRIVADO" != "true" ]; then
            echo "::error::este repositorio esta PUBLICO e o instalador leva os sons do Discord dentro (ATTRIBUTIONS.md)."
            echo "Reponha os sons sinteticos antes de qualquer distribuicao: pnpm --filter @danjocord/client sounds --all"
            exit 1
          fi
      # VERSÃO VEM DA TAG (roadmap 106). O `apps/desktop/package.json` tem uma
      # versão fixa, e é DELE que o electron-builder tira a versão do instalador
      # e do `latest.yml`. Sem este passo, tagear `v0.2.0` geraria um instalador
      # ainda marcado com a versão antiga — e o `electron-updater` compara
      # versões, então os apps instalados NUNCA veriam a atualização. O bug é
      # silencioso: o release sai, o arquivo existe, e a atualização
      # simplesmente não acontece.
      #
      # Escrito no arquivo em vez de `npm version` para não criar commit nem
      # tag: a fonte da verdade da versão é a TAG do git, e o package.json é só
      # o veículo que o electron-builder lê.
      - name: versão do instalador = a tag
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSAO" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::tag '$GITHUB_REF_NAME' não vira semver — use v1.2.3"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('versão do instalador:', j.version);
          " "$VERSAO"
      # --publish always: determinístico, sem depender da detecção de tag do
      # electron-builder (o pnpm anexa os args extras ao fim do script "dist",
      # ou seja, na chamada do electron-builder)
      - run: pnpm --filter @danjocord/desktop dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
