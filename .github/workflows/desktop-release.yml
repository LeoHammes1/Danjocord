# Release do app desktop (M6, refeito no M14): tag v* → instalador Windows
# entregue ao PRÓPRIO SERVIDOR → os apps instalados dos amigos se atualizam.
#
# O que mudou no M14: o instalador NÃO fica num Release do GitHub. Este job
# continua sendo quem compila — NSIS e os módulos nativos precisam de Windows —
# mas em vez de publicar um Release ele faz POST dos artefatos em
# `https://danjocord.leohammes.dev/api/updates/publish`, e eles passam a morar
# no PVC do pod, ao lado do SQLite.
#
# O fluxo, ponta a ponta:
#   1. git tag v0.1.0 && git push origin v0.1.0
#   2. este job roda `pnpm --filter @danjocord/desktop dist --publish never`:
#      bundla o renderer (build do apps/client com VITE_API_BASE de produção),
#      compila o main e chama o electron-builder. O `publish` do package.json é
#      `generic` apontando para o nosso feed — é ISSO que faz o electron-builder
#      gerar o `latest.yml` e carimbar o `app-update.yml` de dentro do app; o
#      `--publish never` só impede o upload, que quem faz é o passo abaixo.
#   3. o job sobe os artefatos NESTA ORDEM: o `.exe` (e o `.blockmap`) primeiro,
#      o `latest.yml` depois, e o commit por último. A ordem importa: um
#      `latest.yml` novo apontando para um `.exe` que ainda não chegou seria uma
#      atualização quebrada para quem checasse naquele minuto. O commit é o que
#      vira a chave — antes dele, o servidor continua servindo o release velho.
#   4. o electron-updater dos apps instalados lê o `latest.yml` do nosso feed
#      (autenticado por tíquete) e baixa a versão nova em segundo plano.
#
# PRÉ-REQUISITO DE UMA VEZ SÓ: um segredo sorteado (`openssl rand -hex 32`) em
# DOIS lugares — `DANJOCORD_PUBLISH_TOKEN` no Secret danjocord-credentials do
# cluster, e o MESMO valor nos secrets de Actions deste repo. Sem ele o passo de
# publicação leva 503 e o job falha alto, que é o que se quer.
#
# NOTA SOBRE OS SONS: 12 dos 14 clipes de UI são assets proprietários do Discord
# (ATTRIBUTIONS.md) e vão dentro deste instalador. Até o M14 havia aqui uma
# trava reprovando o build enquanto eles estivessem no catálogo; ela foi
# retirada a pedido do Leonardo. O que segura hoje é o desenho: o `.exe` só sai
# por `/api/updates`, que exige sessão de membro. Ler a advertência do
# ATTRIBUTIONS.md antes de qualquer coisa que seja distribuição aberta.
name: desktop-release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SERVIDOR: https://danjocord.leohammes.dev

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # a versão do pnpm vem do campo packageManager do package.json raiz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # o build do cliente (dentro do dist, via bundle-renderer) importa o
      # dist do protocol — compilar antes
      - run: pnpm --filter @danjocord/protocol build
      # VERSÃO VEM DA TAG (roadmap 106). O `apps/desktop/package.json` tem uma
      # versão fixa, e é DELE que o electron-builder tira a versão do instalador
      # e do `latest.yml`. Sem este passo, tagear `v0.2.0` geraria um instalador
      # ainda marcado com a versão antiga — e o `electron-updater` compara
      # versões, então os apps instalados NUNCA veriam a atualização. O bug é
      # silencioso: o arquivo existe, e a atualização simplesmente não acontece.
      #
      # Escrito no arquivo em vez de `npm version` para não criar commit nem
      # tag: a fonte da verdade da versão é a TAG do git, e o package.json é só
      # o veículo que o electron-builder lê.
      - name: versão do instalador = a tag
        id: versao
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSAO" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::tag '$GITHUB_REF_NAME' não vira semver — use v1.2.3"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('versão do instalador:', j.version);
          " "$VERSAO"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "exe=Danjocord-Setup-$VERSAO.exe" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @danjocord/desktop dist --publish never

      # A ENTREGA. `--fail-with-body` para o corpo do erro aparecer no log do
      # job: sem ele, um 401 de token errado sai como "exit 22" e nada mais.
      # O content-type é o `application/vnd.danjocord.release`, que no servidor
      # cai num parser de FLUXO — o octet-stream comum bufferizaria os ~100 MB
      # na memória de um pod de 1 GiB.
      - name: subir os artefatos (o .exe antes do latest.yml)
        shell: bash
        env:
          TOKEN: ${{ secrets.DANJOCORD_PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::falta o secret DANJOCORD_PUBLISH_TOKEN nas Actions deste repo (ver deploy/danjocord.yaml)"
            exit 1
          fi
          subir() {
            local arquivo="$1"
            local nome
            nome=$(basename "$arquivo")
            echo "→ $nome ($(stat -c%s "$arquivo" 2>/dev/null || stat -f%z "$arquivo") bytes)"
            curl --fail-with-body -sS -X POST \
              -H "authorization: Bearer $TOKEN" \
              -H "content-type: application/vnd.danjocord.release" \
              --data-binary "@$arquivo" \
              "$SERVIDOR/api/updates/publish?file=$nome"
            echo
          }
          cd apps/desktop/release
          subir "${{ steps.versao.outputs.exe }}"
          # o blockmap é opcional (o download diferencial está desligado no
          # updater.ts), mas sobe junto quando existe: é barato e deixa a porta
          # aberta caso um dia o diferencial faça sentido
          [ -f "${{ steps.versao.outputs.exe }}.blockmap" ] && subir "${{ steps.versao.outputs.exe }}.blockmap"
          subir latest.yml

      # O COMMIT — é ele que decide qual release os amigos baixam. O servidor
      # confere que o .exe E o latest.yml estão no disco antes de aceitar, então
      # um upload interrompido nunca vira meia versão publicada.
      - name: virar a chave
        shell: bash
        env:
          TOKEN: ${{ secrets.DANJOCORD_PUBLISH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "authorization: Bearer $TOKEN" \
            -H "content-type: application/json" \
            -d '{"version":"${{ steps.versao.outputs.versao }}","file":"${{ steps.versao.outputs.exe }}"}' \
            "$SERVIDOR/api/updates/publish/commit"
          echo
